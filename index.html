<!DOCTYPE html>

  <meta charset="UTF-8">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #0b1220, #0f172a);
      color: white;
    }

    .container {
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
    }

    .card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      filter: brightness(0.5);
    }

    .card h3 {
      position: absolute;
      bottom: 10px;
      left: 15px;
      margin: 0;
    }

    .players {
      margin-top: 30px;
    }

    .player {
      display: flex;
      align-items: center;
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      gap: 10px;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    .badges {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-left: auto;
      /* 🔥 los empuja a la derecha */
    }

    .badge {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
    }

    .badge img {
      width: 18px;
      height: 18px;
      padding: 2px;
    }

    .badge span {
      font-size: 8px;
      margin-top: 1px;
    }

    /* tooltip badge */
    .badge-tooltip {
      position: absolute;
      bottom: 130%;
      background: #020617;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .badge:hover .badge-tooltip {
      opacity: 1;
    }

    /* rank */
    .tooltip {
      font-size: 11px;
      padding: 4px 8px;
      background: #0f172a;
      border-radius: 6px;
      margin-left: 8px;
      white-space: nowrap;
    }
  </style>
</head>

    let players = [];

    function addPlayer(name, skinUrl, rank, tiers = {}) {
      const badges = modes.map(mode => ({
        icon: mode.img,
        tier: tiers[mode.name] || "LT5",
        modeName: mode.name
      }));

      players.push({ name, skinUrl, rank, badges });
      renderPlayers();
    }

    function renderPlayers() {
      const container = document.getElementById("players");
      container.innerHTML = "";

      players.forEach(p => {
        const div = document.createElement("div");
        div.className = "player";

        div.innerHTML = `
      <div class="player-left">
        <img src="${p.skinUrl}" />
        <span>${p.name}</span>
      </div>

      <div class="badges">
        ${p.badges.map(b => `
          <div class="badge">
            <img src="${b.icon}" />
            <span>${b.tier}</span>
            <div class="badge-tooltip">${b.modeName}</div>
          </div>
        `).join("")}
      </div>

      <div class="tooltip">${p.rank}</div>
    `;

        container.appendChild(div);
      });
    }

    function renderModes() {
      const container = document.getElementById("modes");

      modes.forEach(mode => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
      <img src="${mode.img}" />
      <h3>${mode.name}</h3>
    `;

        div.addEventListener("click", () => {
          window.location.href = mode.url;
        });

        container.appendChild(div);
      });
    }
