<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Modes UI</title>
<style>
body {
  /*TODO ESTA EN CODIGO ESPAGETTI, YA DESPUES LO ARREGLO, ES SOLO UNA IDEA*/
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(180deg, #0b1220, #0f172a);
  color: white;
}

.container {
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 15px;
}

.card {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.25s ease;
}

.card:hover {
  transform: translateY(-5px) scale(1.03);
}

.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  filter: brightness(0.5);
}

.card::after {
  content: "";
  position: absolute;
  inset: 0;
}

.card h3 {
  position: absolute;
  bottom: 10px;
  left: 15px;
  margin: 0;
  font-size: 18px;
  z-index: 2;
}

.players {
  margin-top: 30px;
}

.player {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: #1e293b;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
  transition: background 0.2s;
}

.player-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.badges {
  display: flex;
  gap: 6px;
}

.badge {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 10px;
}

.badge-tooltip {
  position: absolute;
  bottom: 130%;
  background: #020617;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 11px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.badge:hover .badge-tooltip {
  opacity: 1;
}

.badge img {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #0f172a;
  padding: 3px;
}

.badge span {
  margin-top: 2px;
  font-size: 9px;
  color: #facc15;
}

.player:hover {
  background: #334155;
}

.player img {
  width: 40px;
  height: 40px;
  border-radius: 6px;
}

.tooltip {
  position: absolute;
  right: 10px;
  background: #0f172a;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.player:hover .tooltip {
  opacity: 1;
}

</style>
</head>
<body>

<div class="container">
  <h1>Modos</h1>
  <div class="grid" id="modes"></div>

  <div class="players">
    <h2>Jugadores</h2>
    <div id="players"></div>
  </div>
</div>

<script>

  // TODO ESTA EN CODIGO ESPAGETTI, YA DESPUES LO ARREGLO, ES SOLO UNA IDEA
  
const modes = [
  { name: "Hide and Seek", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTX1bUqAfR8IcEn1bgjWIpcy2JX6Cek4CicDQ&s", url: "modes/hide.html" },
  { name: "SkyWars", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTisOFYUovXkJwWo4ddiEtD_--NUaJN8f2MjQ&s", url: "modes/skywars.html" },
  { name: "Murder Mystery", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEgtTQGxr4yEQ-br6fWnTcIN4iR0iGDO-M_g&s", url: "modes/murder.html" },
  { name: "DeathRun", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIj0QMTOAxAOxPFIvcNETULu41e6Lf8bP5sw&s", url: "modes/deathrun.html" },
  { name: "Build Battle", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4KTAFzIELl8QIVFXvjr82I5Xe9qlOOnsH7g&s", url: "modes/build.html" },
  { name: "Survival Games", img: "https://playhive.com/api/og/en/game/sg", url: "modes/survival.html" },
  { name: "BedWars", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEGxtcEPu2q_JkMgHp6Vq1Y7IG4c2l6cVStg&s", url: "modes/bedwars.html" },
  { name: "Capture the Flag", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSgyW5XSQEOP9tnav3p1IuOT3Ktg1bFKhdgA&s", url: "modes/ctf.html" },
  { name: "The Bridge", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTx26LdP0h2o1BHfdQQTOXcCbB9oZuSe014qg&s", url: "modes/bridge.html" },
  { name: "Block Drop", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3OL2RAyPP3DB3uA3znNRj_I-MLlkoksHHmA&s", url: "modes/blockdrop.html" },
  { name: "Gravity", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRE6mw53-Fo3ClGeoyvcnnfdVnLArM1nBegWA&s", url: "modes/gravity.html" },
  { name: "Block Party", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQw86XSofej2Vt7S2IQbmpME4k29WhosCzXIw&s", url: "modes/blockparty.html" },
  { name: "Ground Wars", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcg_-Il-pdwud4A9AwgDm50wTGlNgcID9VfA&s", url: "modes/groundwars.html" },
  { name: "Parkour Worlds", img: "https://playhive.com/content/images/size/w2000/2024/07/PW_poster_contest.png", url: "modes/parkour.html" }
];

let players = [];

function addPlayer(name, skinUrl, rank, badges = []) {
  players.push({ name, skinUrl, rank, badges });
  renderPlayers();
}

function renderPlayers() {
  const container = document.getElementById("players");
  container.innerHTML = "";

  players.forEach(p => {
    const div = document.createElement("div");
    div.className = "player";
    div.innerHTML = `
      <div class="player-left">
        <img src="${p.skinUrl}" />
        <span>${p.name}</span>
      </div>
      <div class="badges">
        ${p.badges.map(b => {
          const modeMatch = modes.find(m => m.img === b.icon);
          const modeName = modeMatch ? modeMatch.name : (b.name || 'Modo');
          return `
          <div class="badge">
            <img src="${b.icon}" />
            <span>${b.tier}</span>
            <div class="badge-tooltip">${modeName}</div>
          </div>
        `;
        }).join("")}
      </div>
      <div class="tooltip">${p.rank}</div>
    `;
    container.appendChild(div);
  });
}

function renderModes() {
  const container = document.getElementById("modes");

  modes.forEach(mode => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <img src="${mode.img}" />
      <h3>${mode.name}</h3>
    `;

    div.addEventListener("click", () => {
      window.location.href = mode.url;
    });

    container.appendChild(div);
  });
}

addPlayer("IgnChema", "https://mc-heads.net/avatar/IgnChema", "Combat Master (150 pts)", [
  { icon: modes[0].img, tier: "LT1" },
  { icon: modes[1].img, tier: "LT1" },
  { icon: modes[2].img, tier: "LT1" },
]);

addPlayer("zSqmuca", "https://mc-heads.net/avatar/zSqmuca", "Combat Ace (150 pts)", [
  { icon: modes[3].img, tier: "LT1" },
  { icon: modes[4].img, tier: "LT1" },
  { icon: modes[5].img, tier: "LT1" }
]);

addPlayer("Laikan0", "https://mc-heads.net/avatar/Laikan0", "Grandmaster (150 pts)", [
  { icon: modes[6].img, tier: "LT1" },
  { icon: modes[7].img, tier: "LT1" },
  { icon: modes[8].img, tier: "LT1" },
]);

renderModes();
</script>

</body>
</html>
